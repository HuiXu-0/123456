name: zhixue

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhixue-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhixue-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
